name: Renew SSL Certificate

on:
  workflow_dispatch:

jobs:
  renew-ssl:
    name: Renew certificate on VPS
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Renew certificate over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🔎 Detecting renewal strategy..."

            if command -v certbot >/dev/null 2>&1; then
              echo "✅ certbot found on host."
              sudo certbot renew --non-interactive

              if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet nginx; then
                sudo nginx -t
                sudo systemctl reload nginx
              fi
            elif [ -f /home/ubuntu/laumond-app/docker-compose.yml ]; then
              echo "ℹ️ Host certbot not found. Trying Docker certbot service."
              cd /home/ubuntu/laumond-app
              if docker compose config --services | grep -q '^certbot$'; then
                docker compose run --rm certbot renew
                if docker compose config --services | grep -q '^nginx$'; then
                  docker compose exec -T nginx nginx -t
                  docker compose exec -T nginx nginx -s reload
                fi
              else
                echo "❌ No certbot service in docker-compose."
                exit 1
              fi
            else
              echo "❌ No known certificate renewal method found."
              exit 1
            fi

            echo "📄 Checking deployed certificate dates..."
            if [ -f /etc/letsencrypt/live/laumond.com/fullchain.pem ]; then
              sudo openssl x509 -in /etc/letsencrypt/live/laumond.com/fullchain.pem -noout -subject -issuer -dates
            else
              echo "⚠️ Could not find /etc/letsencrypt/live/laumond.com/fullchain.pem"
            fi
